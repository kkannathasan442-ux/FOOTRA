<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="100%" height="100%">
  <defs>
    <!-- Brand Gradient -->
    <linearGradient id="logoBrandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="35%" stop-color="#3b82f6" />
      <stop offset="70%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- River Gradient -->
    <linearGradient id="logoRiverGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Sky Gradient -->
    <linearGradient id="logoSkyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <clipPath id="logoIconClip">
      <rect x="25" y="25" width="230" height="230" rx="55" ry="55" />
    </clipPath>
  </defs>

  <!-- Left App Icon Box -->
  <g transform="translate(10, 0)">
    <rect x="20" y="20" width="240" height="240" rx="60" ry="60" fill="url(#logoBrandGrad)" />
    <rect x="30" y="30" width="220" height="220" rx="52" ry="52" fill="#090d16" />

    <g clip-path="url(#logoIconClip)">
      <!-- Top White Photo Bar/Frame -->
      <rect x="45" y="45" width="190" height="30" rx="6" fill="#ffffff" />
      <line x1="45" y1="75" x2="235" y2="75" stroke="#94a3b8" stroke-width="2" stroke-opacity="0.3" />

      <!-- Sky Area -->
      <rect x="45" y="75" width="190" height="75" fill="url(#logoSkyGrad)" />

      <!-- Mountain 1 (Center Tall Peak) -->
      <polygon points="120,80 152,130 88,130" fill="#ffffff" />
      <polygon points="120,80 185,180 55,180" fill="#0f172a" />
      <polygon points="120,80 135,115 120,115 112,105 117,98" fill="#ffffff" />

      <!-- Mountain 2 (Right Peak) -->
      <polygon points="185,110 225,170 145,170" fill="#1e293b" />
      <polygon points="185,110 202,140 168,140" fill="#ffffff" />

      <!-- Mountain 3 (Left Peak) -->
      <polygon points="75,115 105,155 45,155" fill="#1e293b" />
      <polygon points="75,115 88,135 62,135" fill="#ffffff" />

      <!-- Foreground Hills -->
      <path d="M 30,165 Q 90,145 140,170 Q 205,150 250,175 L 250,250 L 30,250 Z" fill="#090d16" />
      <path d="M 30,190 Q 100,175 160,200 Q 210,180 250,205 L 250,250 L 30,250 Z" fill="#0f172a" />

      <!-- Flowing River -->
      <path d="M 130,160 C 120,180 140,195 125,215 C 110,230 135,240 120,250 L 85,250 C 105,235 90,220 105,200 C 120,180 110,170 125,160 Z" fill="url(#logoRiverGrad)" />
      <path d="M 128,162 C 121,181 138,196 126,215 C 116,228 131,238 119,248" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6" />
    </g>
  </g>

  <!-- Brand Typography -->
  <!-- Main Title: FOOTRA -->
  <text x="310" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Outfit', 'Inter', sans-serif" font-size="112" font-weight="900" fill="#ffffff" letter-spacing="4">
    FOOTRA
  </text>

  <!-- Tagline: Create Once. Apply Everywhere. -->
  <text x="315" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="34" font-weight="500" fill="#94a3b8" letter-spacing="0.5">
    Create Once. Apply Everywhere.
  </text>
</svg>
