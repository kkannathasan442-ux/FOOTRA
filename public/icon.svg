<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Border & Accent Gradient -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="35%" stop-color="#3b82f6" />
      <stop offset="70%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- River Gradient -->
    <linearGradient id="riverGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Sky Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Clip Path for Inner Content -->
    <clipPath id="squircleClip">
      <rect x="24" y="24" width="464" height="464" rx="110" ry="110" />
    </clipPath>
  </defs>

  <!-- Outer Rounded Square with Gradient Border -->
  <rect x="16" y="16" width="480" height="480" rx="120" ry="120" fill="url(#brandGrad)" />
  <rect x="36" y="36" width="440" height="440" rx="104" ry="104" fill="#090d16" />

  <!-- Inner Group Clipped -->
  <g clip-path="url(#squircleClip)">
    <!-- Top White Photo Bar/Frame -->
    <rect x="65" y="65" width="382" height="60" rx="12" fill="#ffffff" />
    <line x1="65" y1="125" x2="447" y2="125" stroke="#94a3b8" stroke-width="4" stroke-opacity="0.3" />

    <!-- Sky Area -->
    <rect x="65" y="125" width="382" height="150" fill="url(#skyGrad)" />

    <!-- Mountain 1 (Left & Center Tall Peak) -->
    <!-- Snow Cap -->
    <polygon points="210,135 275,240 145,240" fill="#ffffff" />
    <!-- Mountain Body -->
    <polygon points="210,135 340,340 80,340" fill="#0f172a" />
    <!-- Snow highlight -->
    <polygon points="210,135 240,210 210,210 195,185 205,170" fill="#ffffff" />

    <!-- Mountain 2 (Right Peak) -->
    <polygon points="340,195 420,320 260,320" fill="#1e293b" />
    <!-- Snow Cap 2 -->
    <polygon points="340,195 375,255 305,255" fill="#ffffff" />

    <!-- Mountain 3 (Far Left Smaller Peak) -->
    <polygon points="120,205 180,290 60,290" fill="#1e293b" />
    <polygon points="120,205 145,245 95,245" fill="#ffffff" />

    <!-- Dark Foreground Hills -->
    <path d="M 36,310 Q 150,270 250,320 Q 380,280 476,330 L 476,476 L 36,476 Z" fill="#090d16" />
    <path d="M 36,360 Q 180,330 300,380 Q 400,340 476,390 L 476,476 L 36,476 Z" fill="#0f172a" />

    <!-- River Flowing Forward (Curved Neon Glow Path) -->
    <path d="M 230,300 C 210,340 250,370 220,410 C 190,440 240,460 210,480 L 140,480 C 180,450 150,420 180,380 C 210,340 190,320 220,300 Z" fill="url(#riverGrad)" />

    <!-- River Light Reflection Highlight -->
    <path d="M 226,305 C 212,342 246,372 222,410 C 202,435 232,455 208,476" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.6" />
  </g>
</svg>
